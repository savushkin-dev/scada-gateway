# ============================================================================
# ЕДИНЫЙ СТЕК SCADA — поднимается одной командой.
#
#   ./up.sh                       # соберёт jar шлюза (если надо) и поднимет всё
#   docker compose up -d --build  # если jar уже собран (target/*.jar)
#
#   postgres  — БД шлюза (scada_db); схема под Flyway (db/migration), ddl-auto=validate
#   kafka     — брокер (KRaft, одна нода); топики авто-создаются при первой записи
#   simulator — PLC-эмулятор: OPC UA (:4840) + Modbus TCP (:5020) + PAC (:10000), replay архива
#   gateway   — Spring Boot: опрашивает симулятор по 3 протоколам → Kafka
#
# Порты на хост:
#   8888  — HTTP/actuator шлюза
#   9094  — Kafka для монитора/хоста (bootstrap localhost:9094)
#   5433  — PostgreSQL
#   4840/5020/10000 — OPC UA / Modbus / PAC симулятора (для отладки)
#
#   docker compose logs -f gateway     # логи шлюза
#   docker compose down                # стоп (данные БД сохранятся в volume)
#   docker compose down -v             # стоп + стереть данные БД
# ============================================================================

name: scada

services:

  # ----------------------------- PostgreSQL --------------------------------
  postgres:
    image: postgres:16
    container_name: scada-postgres
    environment:
      POSTGRES_DB: scada_db
      POSTGRES_USER: scada_user
      POSTGRES_PASSWORD: scada_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scada_user -d scada_db"]
      interval: 5s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M
    networks: [scada]

  # ------------------------------- Kafka -----------------------------------
  # Два listener'а: PLAINTEXT (внутри сети — kafka:9092, для шлюза) и
  # EXTERNAL (localhost:9094, для монитора/хоста).
  kafka:
    image: apache/kafka:latest
    container_name: scada-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: scada-cluster-0001
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks: [scada]

  # ----------------------------- Simulator ---------------------------------
  simulator:
    build: ./plc-simulator
    container_name: scada-simulator
    environment:
      # Сервер анонсирует резолвимое в сети имя (иначе Milo после discovery
      # не переподключится). plc.py читает OPCUA_ENDPOINT/MODBUS_PORT/PAC_PORT из env.
      OPCUA_ENDPOINT: "opc.tcp://simulator:4840"
      MODBUS_PORT: "5020"
      PAC_PORT: "10000"                 # третий протокол — PAC (driver-master)
    ports:
      - "4840:4840"
      - "5020:5020"
      - "10000:10000"                   # PAC (driver-master) — для отладки с хоста
    # Liveness: процесс жив и серверы слушают. OPC UA (4840) биндится на
    # advertised-хост (simulator), НЕ на loopback, поэтому в пробе проверяем
    # Modbus (5020) и PAC (10000) на 127.0.0.1 — оба на 0.0.0.0 (если они
    # слушают, поднят и весь симулятор — серверы стартуют вместе в plc.py).
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;[socket.create_connection(('127.0.0.1',p),2).close() for p in (5020,10000)]"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M
    networks: [scada]

  # ------------------------------ Gateway ----------------------------------
  gateway:
    build: ./SCADA-gateway            # Dockerfile копирует готовый target/*.jar
    container_name: scada-gateway
    environment:
      # Переопределяем localhost из application.yaml на сервисы compose.
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/scada_db"
      SPRING_DATASOURCE_USERNAME: "scada_user"
      SPRING_DATASOURCE_PASSWORD: "scada_password"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SIM_HOST: "simulator"           # → opcua.servers[*].endpoint (OPC UA + Modbus)
    # Пользовательские Lua-скрипты обработки значений: правки подхватываются без перезапуска.
    volumes:
      - ./SCADA-gateway/scripts:/app/scripts:ro
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      simulator:
        condition: service_healthy
    # UP, когда контекст поднялся и БД/Kafka доступны (Spring Boot actuator health).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks: [scada]

networks:
  scada:
    driver: bridge

volumes:
  pgdata:
