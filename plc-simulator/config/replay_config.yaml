# ============================================================================
# Симулятор = ТРИ КОНТРОЛЛЕРА с родными форматами. Целый прибор на один контроллер.
#   Phoenix / OPC UA  — каналов 2133: приборы как объекты, поля = типизированные узлы
#   WAGO / Modbus TCP — каналов 212: поля = регистры (INT32 → int16, FLOAT → float32, 2 рег.)
#   PAC Savushkin     — каналов 172: приборы первой линии, протокол driver-master
# Типы полей заданы справочником docs/BN1_MCA1-типы-тегов.csv; раскладку делает
# tools/apply_tag_types.py. Писать можно в любой канал, включая Modbus.
# Генерация включена (tools/enable_replay.py): каждый канал ведёт архивная серия,
# пока оператор не запишет своё значение — тогда тег защёлкивается на записи (латч
# в core/plc.py). Писать можно в любой канал, включая Modbus.
# channelId = node.id из базы каналов.
# ============================================================================
