    # ТРЕТИЙ ТИП КОНТРОЛЛЕРА — PAC (протокол driver-master, Savushkin/ptusa).
    # В dev-стеке PAC отдаёт СИМУЛЯТОР (plc-simulator/config/replay_config.yaml, :10000).
    #   endpoint  — pac://host:port (порт по умолчанию 10000);
    #   nodeId    — синтетический "pac:<id>" (OPC UA-узла у PAC нет, поле обязательное);
    #   channelId — КЛЮЧ в Lua-таблице tags, что отдаёт PAC (= node.id сима) + Kafka tagId;
    #   deviceName/fieldName — для команд записи (__<device>:set_cmd('<field>',1,val)).
    # channelId 9001..9007 — демо-приборы (вне реальных 2471); под реальные PAC заменить.
    # ========================================================================
