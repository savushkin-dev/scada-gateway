# ============================================================================
# Конфигурация SCADA-шлюза. Секции ниже:
#   server      — HTTP-порт (actuator + REST мониторинга)
#   spring      — datasource (Postgres), JPA (ddl-auto=validate), Flyway, Kafka
#   gateway     — флаги горячего пути (persist-telemetry, таймауты OPC UA/Modbus)
#   logging     — уровни логов
#   management  — actuator + метрики Prometheus (/actuator/prometheus)
# Контроллеры и теги вынесены в controllers.yaml (подключается через spring.config.import).
# ============================================================================
server:
  port: 8888

# yaml-language-server: $schema=

spring:
  # Контроллеры и теги вынесены в отдельный файл (был раздут до 915 КБ). По умолчанию —
  # встроенный конфиг стенда (симулятор). Реальная станция — внешний файл без пересборки:
  #   CONTROLLERS_CONFIG=file:/app/config/BN1_MCA1.yaml PAC_HOST=<IP контроллера>
  # (config/stations/*.yaml генерирует tools/station_config.sh из базы каналов и проекта ПЛК).
  config:
    import: ${CONTROLLERS_CONFIG:classpath:controllers.yaml}
  application:
    name: scada-gateway

  # Пул планировщика @Scheduled. Дефолт Spring Boot = 1 поток: один зависший
  # супервизор заморозил бы ВСЕ периодические задачи (супервизор + сводка здоровья).
  # 3 потока — задачи идут независимо. (См. gateway-opcua-write-issue.md, фикс №2.)
  task:
    scheduling:
      pool:
        size: 3
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/scada_db}
    username: ${DB_USERNAME:scada_user}
    password: ${DB_PASSWORD:scada_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      # Схемой теперь владеет Flyway; Hibernate только СВЕРЯЕТ (validate), не меняет.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Flyway владеет схемой (миграции db/migration/Vn__*.sql). baseline-on-migrate: на
  # СУЩЕСТВУЮЩЕЙ БД (создана Hibernate) ставит baseline V1 и НЕ гоняет V1 повторно;
  # на ПУСТОЙ БД гоняет V1 с нуля. Дальше схему меняем только новыми Vn-миграциями.
  flyway:
    baseline-on-migrate: true
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: 
          telemetry: com.scada.gateway.kafka.dto.TelemetryMessage,
          alarm: com.scada.gateway.kafka.dto.AlarmMessage,
          event: com.scada.gateway.kafka.dto.EventMessage
        # Идемпотентный продюсер: без него retries>0 при повторной отправке может
        # ПЕРЕСТАВИТЬ сообщения внутри партиции. Тег ключуется по имени (всё в одну
        # партицию) → старое значение способно лечь после нового = моргание
        # устаревшей телеметрии на мониторе. enable.idempotence: брокер дедуплицирует
        # по seq и держит порядок в партиции.
        enable.idempotence: true
        # Идемпотентность требует acks=all. В стенде репликация=1, поэтому acks=all
        # ждёт только лидера — по задержке это ровно как acks=1, но уже с гарантией
        # порядка. На реальном кластере то же станет и гарантией долговечности.
        acks: all
        # <=5 безопасно и упорядоченно при включённой идемпотентности.
        max.in.flight.requests.per.connection: 5
        retries: 10
        # Обрыв брокера НЕ должен морозить поток опроса ПЛК: send() не виснет дольше
        # 5с (ожидание метадаты / переполнение буфера) — падает быстро, следующий
        # цикл пришлёт свежее значение. Иначе поток чтения встаёт на max.block.ms=60с.
        max.block.ms: 5000
        # ВАЖНО: под properties идут СЫРЫЕ имена клиента Kafka (с точками). Было
        # compression-type/batch-size (Spring-имена) — клиент их не знал и игнорировал,
        # snappy по факту НЕ включалась. Правильные ключи:
        compression.type: snappy
        batch.size: 32768
        linger.ms: 5
    consumer:
      group-id: scada-gateway-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.scada.gateway.kafka.dto
    admin:
      auto-create: false
  
  docker:
    compose:
      enabled: false

modbus:
  host: 127.0.0.1
  port: 5020
  enabled: true

kafka:
  enabled: true
  # В проводе: телеметрия + события + алармы. События также пишутся в БД шлюза
  # (event_log) как журнал; в Kafka они идут для монитора (топики events/alarms).
  publish:
    events: true
    alarms: true
  # Телеметрия идёт в топик, который СЛУШАЕТ монитор (runtime: KafkaProperties.tagsTopic
  # = scada.tags, TagKafkaConsumer.subscribe). Имя топика — единая точка стыка шлюз↔монитор.
  topics:
    telemetry: scada.tags
    alarms: scada-alarms
    events: scada-events
    commands: scada-commands
    command-results: scada-command-results

# ============================================================================
# Флаги горячего пути шлюза. Меняются без пересборки (перезапуск шлюза).
# ============================================================================
gateway:
  alarms:
    # Проверка порогов/алармов в шлюзе. По умолчанию ВЫКЛ — алармы считает Monitor.
    # true → шлюз снова генерит алармы (edge-триггер p1/p99) в топик scada-alarms.
    enabled: false
  # Писать каждую точку в локальную БД шлюза (таблица telemetry). В Kafka значения
  # идут в любом случае; это лишь локальная история. false → БД шлюза не пишется.
  persist-telemetry: true
  # A3: слать ли кадр телеметрии при обрыве (value=null, quality=BAD). По умолчанию
  # ВЫКЛ: без правок монитора (C4: onChange не дёргается на не-GOOD) и фронта
  # (B2: рендер «нет данных») null «уверенно закроет клапан». Включать ТОЛЬКО когда
  # обе стороны готовы — тогда оператор увидит потерю связи, а не замерший тег.
  send-bad-frames: false
  # Таймаут блокирующих OPC UA-вызовов (discovery / connect / read / write / disconnect).
  # Без него зависший handshake/чтение вешает поток супервизора/опроса НАВСЕГДА. 5 c →
  # быстро падаем и ретраим на следующем цикле супервизора; неудача видна в event_log.
  opcua-op-timeout-ms: 5000
  # Таймаут Modbus (j2mod) на connect И на чтение транзакции. j2mod имеет неявный дефолт
  # 3000 мс — задаём явно, чтобы не зависеть от дефолта библиотеки и иметь возможность крутить.
  modbus-op-timeout-ms: 3000
  # Команды старше — в ПЛК не отправляются (статус REJECTED_EXPIRED): так после простоя
  # шлюза не исполнятся команды, накопившиеся в топике (монитор списал их по таймауту 5 c).
  # Возраст считается по часам монитора — нужен NTP; запас на расхождение часов.
  commands:
    max-age-ms: 30000
  # Пользовательские Lua-скрипты обработки значений: папка с scripts.yaml (привязки
  # «скрипт → маски каналов + параметры») и *.lua. Скрипт получает каждое снятое значение
  # до Kafka/истории/алармов (масштаб, отсев кода обрыва, фильтр); необязательный write()
  # пересчитывает команду оператора в значение ПЛК. Нет папки или scripts.yaml — значения
  # идут как есть. Примеры и контракт — SCADA-gateway/scripts/.
  scripts:
    dir: scripts
    # Лимит времени на один вызов скрипта; превысил — кадр BAD.
    timeout-ms: 50
    # Как часто проверять папку на изменения (подхват без перезапуска).
    reload-interval-ms: 5000
  # --------------------------------------------------------------------------
  # Горячее резервирование: два экземпляра шлюза на одних топиках; активный — один,
  # выбирается через группу Kafka (см. ha/LeaderElector). Резервный держит соединения
  # с ПЛК и опрашивает их, но в Kafka не публикует и команды не исполняет — при падении
  # активного подхватывает за session-timeout-ms (штатная остановка — за доли секунды).
  # Оба экземпляра — с ОДИНАКОВЫМ controllers.yaml и топиками.
  # --------------------------------------------------------------------------
  ha:
    enabled: false
    # Имя экземпляра в логах, журнале и /api/ha. Пусто — имя хоста + pid.
    instance-id: ""
    # Служебный топик выборов (1 партиция, создаётся автоматически).
    topic: scada-gateway-ha
    # Группа пары. Пусто — scada-gateway-ha.<топик команд>: шлюзы разных станций не смешаются.
    group-id: ""
    # Время обнаружения падения активного. Должно быть в пределах group.min.session.timeout.ms
    # (по умолчанию 6000) и group.max.session.timeout.ms брокера. Для переключения за 2–3 c
    # на брокере уменьшают минимум (KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS=1000, см.
    # docker-compose.ha.yml) и ставят здесь 2000.
    session-timeout-ms: 6000
    # Частота heartbeat — не больше трети session-timeout.
    heartbeat-interval-ms: 1000

logging:
  level:
    com.scada.gateway: INFO
    org.eclipse.milo: WARN
    # Внутренний netty-хендлер Milo сыплет ERROR+стектрейс «Connection reset» при
    # обрыве OPC UA — это уже чисто фиксирует markControllerDown, поэтому глушим.
    org.eclipse.milo.opcua.stack.client.transport.uasc.UascClientMessageHandler: "OFF"
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{0} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: scada-gateway
