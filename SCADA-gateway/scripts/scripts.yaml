# ============================================================================
# Пользовательские скрипты обработки значений каналов (Lua 5.2, LuaJ).
#
# Привязка: скрипт → маски имён каналов (+ параметры). Скрипт получает КАЖДОЕ снятое
# значение канала до того, как оно уйдёт в Kafka, историю и алармы; необязательная функция
# write() пересчитывает команду оператора в значение для ПЛК.
#
#   - script: <файл.lua в этой папке>
#     tags: [<маска>, ...]      # * — любые символы, ? — один символ, остальное буквально
#                               #   (скобки [ ] — буквально: "*.OBJECT1.RT_PAR_F[7]")
#     params: {ключ: значение}  # доступны скрипту как ctx.params
#     enabled: false            # временно выключить привязку
#
# Несколько привязок на канал — цепочка в порядке этого файла (команда — в обратном).
# Изменения подхватываются без перезапуска (раз в gateway.scripts.reload-interval-ms);
# версия с ошибкой не применяется — работает прежняя (лог, событие SCRIPT в журнале).
# Состояние: GET /api/scripts. Ошибка скрипта на значении — кадр BAD (value=null).
#
# Контракт скрипта:
#   function process(value, quality, ctx)   -- обязательна; value = nil у кадра BAD
#     return value, quality                 -- quality ("GOOD"/"BAD") можно не возвращать
#   end
#   function write(value, ctx)              -- необязательна: команда → значение ПЛК
#     return value
#   end
#   ctx: tag, device, field, device_type, data_type, unit, params, timestamp (мс),
#        state — таблица канала, живёт между вызовами (фильтры, мёртвая зона).
# Недоступны: файлы, ОС, модули, load/loadstring, pcall. Лимит — gateway.scripts.timeout-ms.
# ============================================================================
scripts: []

# Примеры (раскомментировать, заменив scripts: [] выше):
#
# scripts:
#   # Датчик температуры в обрыве пишет ±3276.7 — показываем «нет данных», а не 3276 °C.
#   - script: sensor_break.lua
#     tags: ["Барановичи-1.BN1_MCA1.TE_V.*.V"]
#     params: {valid_min: -50, valid_max: 150}
#
#   # Время включения двигателя: в ПЛК миллисекунды, оператору — секунды; команда
#   # оператора в секундах уходит в ПЛК в миллисекундах (write).
#   - script: scale.lua
#     tags: ["Барановичи-1.BN1_MCA1.M_P_ON_TIME.LINE?M*.P_ON_TIME"]
#     params: {k: 0.001, b: 0}
#
#   # Мёртвая зона: дрожание аналогового сигнала меньше delta не меняет значение.
#   - script: deadband.lua
#     tags: ["*.QT_V.*.V"]
#     params: {delta: 0.05}
